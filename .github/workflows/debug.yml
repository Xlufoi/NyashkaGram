name: Build (arm64-v8a)

on:
  push:
    branches:
      - dev
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/debug.yml'
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload: If want ignore'
        required: false

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build NyashkaGram (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch Status
        run: |
          sed -i 's/\/\///g' settings.gradle

      - name: Checkout Library
        run: |
          git submodule update --init

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install NDK
        run: |
          echo "y" | sdkmanager --install "ndk;27.2.12479018" --sdk_root=${ANDROID_SDK_ROOT} &> /dev/null
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/27.2.12479018" >> local.properties

      - name: Native Cache (arm64-v8a)
        id: cache
        uses: actions/cache@v6
        with:
          path: |
            TMessagesProj/src/main/libs
          key: ${{ hashFiles('TMessagesProj/jni/**') }}-arm64-v8a

      - name: Native Build (arm64-v8a)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          export NATIVE_TARGET="arm64-v8a"
          ./run libs native

      - name: Prepare Signing Keystore
        run: |
          if [ ! -f TMessagesProj/release.keystore ]; then
            keytool -genkey -v -keystore TMessagesProj/release.keystore -alias key0 -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=NyashkaGram, OU=NyashkaGram, O=NyashkaGram, L=Default, S=Default, C=RU"
          fi

      - name: Configure Gradle
        run: |
          sed -i "s/2000000000000/$(date +%s%N | cut -c1-13)/g" gradle.properties
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Gradle Build (arm64-v8a)
        run: |
          export KEYSTORE_PASS="123456"
          export ALIAS_NAME="key0"
          export ALIAS_PASS="123456"
          export NATIVE_TARGET="arm64-v8a"
          export GITHUB_RUN_NUMBER="${{ github.run_number }}"
          ./gradlew TMessagesProj:assembleRelease --build-cache --no-configuration-cache

          mkdir -p release_apks
          cp $(find TMessagesProj/build/outputs/apk -name '*arm64-v8a*.apk') release_apks/
          ls -lh release_apks/

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: NyashkaGram-arm64-v8a
          path: release_apks/*.apk

      - name: Create Official First Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.0
          name: NyashkaGram v1.0.0 (Release)
          body: |
            # 🐾 NyashkaGram v1.0.0

            ### 🇷🇺 Русский
            Уютный, красивый и облегчённый Telegram-клиент для Android.
            - **Material 3 Expressive**: мягкие органичные формы, плавные переходы и живые акценты Monet.
            - **Облегчённый клиент**: полностью удалена ненужная аналитика, трекеры и лишний код для максимальной плавности (120+ Гц).

            ### 🇬🇧 English
            A cute, cozy, and lightweight Telegram client for Android.
            - **Material 3 Expressive**: playful soft shapes, fluid transitions, and dynamic Monet palette.
            - **Streamlined Client**: background telemetry and analytics removed for maximum responsiveness and high-refresh smoothness.

            ### 🇨🇳 简体中文
            一款可爱、纯净且极致轻盈的 Android 端 Telegram 客户端。
            - **Material 3 Expressive**：灵动圆角、活泼微动效与 Monet 动态取色。
            - **轻量纯粹**：剔除所有冗余后台遥测与分析代码，畅享高刷丝滑体验。

            ---
            #### ❤️ Благодарности / Credits / 致谢:
            [Telegram](https://github.com/DrKLO/Telegram) • [NekoX](https://github.com/NekoX-Dev/NekoX) • [Nekogram](https://gitlab.com/Nekogram/Nekogram) • [TeleTux](https://github.com/TeleTux/TeleTux) • [OwlGram](https://github.com/OwlGramDev/OwlGram) • [Nullgram](https://github.com/qwq233/Nullgram) • [Nagram](https://github.com/NextAlone/Nagram) • [Shxvi](https://github.com/Shxvi/) (тестирование и помощь в дизайне / testing & design) 🌸
          draft: false
          prerelease: false
          make_latest: true
          files: release_apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release (Nightly)
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: nightly-${{ github.run_number }}
          name: NyashkaGram Nightly #${{ github.run_number }} (v1.0.0)
          body: |
            ### NyashkaGram v1.0.0 Nightly Build #${{ github.run_number }}
            - Release: **v1.0.0**
            - Architecture: **arm64-v8a (64-bit)**
            - Commit: `${{ github.sha }}`
          draft: false
          prerelease: false
          files: release_apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
