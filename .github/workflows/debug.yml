name: Build (arm64-v8a)

on:
  push:
    branches:
      - dev
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/debug.yml'
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload: If want ignore'
        required: false

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build NyashkaGram (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch Status
        run: |
          sed -i 's/\/\///g' settings.gradle

      - name: Checkout Library
        run: |
          git submodule update --init

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install NDK
        run: |
          echo "y" | sdkmanager --install "ndk;27.2.12479018" --sdk_root=${ANDROID_SDK_ROOT} &> /dev/null
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/27.2.12479018" >> local.properties

      - name: Native Cache (arm64-v8a)
        id: cache
        uses: actions/cache@v6
        with:
          path: |
            TMessagesProj/src/main/libs
          key: ${{ hashFiles('TMessagesProj/jni/**') }}-arm64-v8a

      - name: Native Build (arm64-v8a)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          export NATIVE_TARGET="arm64-v8a"
          ./run libs native

      - name: Prepare Signing Keystore
        run: |
          if [ ! -f TMessagesProj/release.keystore ]; then
            keytool -genkey -v -keystore TMessagesProj/release.keystore -alias key0 -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=NyashkaGram, OU=NyashkaGram, O=NyashkaGram, L=Default, S=Default, C=RU"
          fi

      - name: Configure Gradle
        run: |
          sed -i "s/2000000000000/$(date +%s%N | cut -c1-13)/g" gradle.properties
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Gradle Build (arm64-v8a)
        run: |
          export KEYSTORE_PASS="123456"
          export ALIAS_NAME="key0"
          export ALIAS_PASS="123456"
          export NATIVE_TARGET="arm64-v8a"
          export GITHUB_RUN_NUMBER="${{ github.run_number }}"
          ./gradlew TMessagesProj:assembleRelease --build-cache --no-configuration-cache

          mkdir -p release_apks
          cp $(find TMessagesProj/build/outputs/apk -name '*arm64-v8a*.apk') release_apks/
          ls -lh release_apks/

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: NyashkaGram-arm64-v8a
          path: release_apks/*.apk

      - name: Create Official First Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.0
          name: NyashkaGram v1.0.0 (Release)
          body: |
            ## 🎉 Первый официальный релиз — NyashkaGram v1.0.0!

            Клиент Telegram с глубокой интеграцией **Material 3 Expressive** и динамическими цветами **Monet (Android 12+)**.

            ### 🎵 Музыкальный плеер (AOSP / Material You):
            - **Морфящаяся кнопка Play/Pause**:
              - В паузе — широкая гладкая овальная пилюля (`84x52 dp`).
              - При воспроизведении — плавно трансформируется в прямоугольный блок с углами («около квадратная»).
              - Окрашена в основной акцентный цвет Monet темы (`chats_actionBackground`) с высококонтрастной иконкой (`chats_actionIcon`).
            - **Кнопки переключения треков (Prev / Next)**:
              - Идеально круглые (`44x44 dp`).
              - При нажатии плавно трансформируются в скруглённый квадрат с тактильным откликом и векторной анимацией, возвращаясь в круг при отпускании.
              - Окрашены в тональный вторичный контейнер Monet темы с акцентными иконками (`player_buttonActive`).
            - **Живой ползунок трека (Squiggly Seekbar)**:
              - Плавная синусоидальная волна активна строго во время воспроизведения музыки и аккуратно выпрямляется в ровную прямую линию при паузе.

            ### 🎨 Иконка приложения и цветовые варианты:
            - Установлена новая иконка приложения высокого разрешения из `1793909594296.jpg`.
            - Подготовлены адаптированные тематические иконки: **Default (Фиолетовая)**, **Blue (Синяя)**, **DarkBlue (Глубокая синяя)**, **DarkGreen (Изумрудная)**, **Neon (Неоновая)**, **Niello (Чёрно-серебряная)**, **Colorful (Закатно-коралловая)**, **Google**.
            - Новая адаптивная монохромная иконка для Monet-темы Android 13+.
            - Обновлена круглая иконка в шторке уведомлений и звонках (`ic_launcher_dr`).

            ### ⚡ Производительность и оптимизация:
            - Принудительная фиксация высокой частоты экрана 120/144 Гц с аппаратным `preferredDisplayModeId`.
            - Оптимизированный скролл списков чатов (`chatListView`).
            - Полное вырезание аналитики Sentry, телеметрии и сбора Crashlytics.

            ---
            - **Архитектура**: arm64-v8a
            - **Ветка**: `dev`
            - **Коммит**: `${{ github.sha }}`
          draft: false
          prerelease: false
          make_latest: true
          files: release_apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release (Nightly)
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: nightly-${{ github.run_number }}
          name: NyashkaGram Nightly #${{ github.run_number }} (v1.0.0)
          body: |
            ### NyashkaGram v1.0.0 Nightly Build #${{ github.run_number }}
            - Release: **v1.0.0**
            - Architecture: **arm64-v8a (64-bit)**
            - Commit: `${{ github.sha }}`
          draft: false
          prerelease: false
          files: release_apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
